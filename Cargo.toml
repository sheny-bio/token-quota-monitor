[package]
name = "token-quota-monitor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tqm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
dirs = "6"
dialoguer = "0.11"

[profile.release]
opt-level = "z"
lto = true
strip = true
